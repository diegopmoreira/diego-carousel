name: narcisista-talvez-voces-sejam-dois
published: post30:03
family: cinematic_condensed
thesis: "Relação com narcisista é encaixe: o tirano e o meigo se escolhem porque um completa o vício do outro — o antídoto não é entender mais, é cortar o contrato."
architecture: deconstruction
hook_family: controlled_accusation
cta: comment_keyword
slides:
  - n: 1
    role: interruption
    headline: "SE VOCÊ TÁ COM UMA PESSOA NARCISISTA, TALVEZ VOCÊS SEJAM DOIS."
    body: null
  - n: 2
    role: conflict
    headline: "ANTES DE VOCÊ FICAR OFENDIDO: ISSO NÃO “PASSA PANO” PRA ABUSO"
    body: "Tem gente realmente manipuladora e destrutiva, sim. Mas o ponto é outro: relacionamento é encaixe. Narcisista não fica muito tempo com gente inteira. Ele precisa de alguém que aceite o teatro — seja por carência, por vaidade, ou por vontade de controlar por outro caminho."
  - n: 3
    role: revelation
    headline: "NARCISISTA NÃO É SÓ O GRANDIOSO QUE MANDA E HUMILHA"
    body: "Existe o tirano (barulhento) e existe o meigo (silencioso). Um controla por ameaça. O outro controla por culpa. Um diz “me obedece”. O outro diz “cuida de mim sem limite”. Os dois usam gente pra regular autoestima e não ficar pequenos por dentro."
  - n: 4
    role: mechanism
    headline: "O TIRANO QUER OBEDIÊNCIA E PALCO"
    body: "Ele precisa ser o centro. Ele domina, some, volta heróico, faz gesto bonito, depois pisa de novo. Não é confusão. É método. O prêmio intermitente vicia: você aguenta o ruim porque lembra do “bom” e acha que consegue resgatar aquilo."
  - n: 5
    role: mechanism
    headline: "O MEIGO CRIA VÁCUO E TE PUXA PRA DENTRO"
    body: "Ele parece frágil demais, perdido demais, sensível demais. Você sente vontade de orientar, salvar, consertar. Só que isso é controle também. É como se ele dissesse: “eu mando que tu me mandes”. Quando você tenta se afastar, ele não grita — ele adoece, culpa, faz indireta e te amarra pela consciência."
  - n: 6
    role: mechanism
    headline: "POR ISSO ESSES DOIS SE ESCOLHEM: UM COMPLETA O VÍCIO DO OUTRO"
    body: "O tirano precisa de alguém que não vá embora. O meigo precisa de alguém que se sinta indispensável. A troca é suja: um quer poder. O outro quer pedágio afetivo. E os dois chamam isso de amor, porque “amor” soa melhor do que “contrato”."
  - n: 7
    role: second_turn
    headline: "A “VÍTIMA” PODE SER NARCISISTA JUSTAMENTE PORQUE PARECE BOA DEMAIS"
    body: "O narcisista meigo é perigoso por isso: ele se esconde atrás de empatia, sofrimento e “coração bom”. Ele não controla com força — controla com moral. E moral usada como arma é uma das coisas mais feias dentro de casa."
  - n: 8
    role: escalation
    headline: "O TESTE QUE DÓI É SIMPLES: POR QUE VOCÊ FICA?"
    body: "Você fica porque tem medo de ficar sozinho? Porque quer provar que é forte? Porque gosta de intensidade? Porque precisa ser necessário? Porque quer “vencer” o outro e ser reconhecido? Se qualquer uma dessas respostas for “sim”, você já entrou no jogo. E jogo de narcisismo não tem final feliz — tem reprise."
  - n: 9
    role: reorganization
    headline: "O ANTÍDOTO NÃO É ENTENDER MAIS. É CORTAR O CONTRATO"
    body: "Limite verificável. Sem discurso bonito. Se tem ameaça, você não negocia. Se tem culpa como arma, você não corre atrás. Você nomeia (“isso é chantagem / isso é imposição”), define consequência e cumpre. Sem consequência, você só está treinando o outro a continuar."
  - n: 10
    role: hammer
    headline: "DOIS CAMINHOS DE HOMEM ADULTO"
    body: "Ou você sai do teatro e vira uma pessoa difícil de manipular — porque tem chão, limite e vida própria. Ou você continua repetindo a novela e chamando de “amor complicado”.\n\nComenta: você se reconheceu mais no tirano ou no meigo? E qual foi o “contrato” que você aceitou sem perceber?"
notes: "TOP DESEMPENHO (indicado por Diego em 27/09). Acusação controlada na capa ('talvez vocês sejam dois') com defesa imediata no P2 ('isso não passa pano pra abuso') — gancho agressivo, desenvolvimento justo. Tipologia em pares (tirano × meigo) e a virada do P7 ('a vítima pode ser narcisista'). Metáfora contábil/jurídica: contrato, pedágio afetivo, reprise. Imagens: A Substância (filme recente, cult, atrizes com forte capital erótico — Margaret Qualley e Demi Moore) em quase todos os painéis, mais Devil Wears Prada e Game of Thrones pontualmente; o filme espelha o tema (duplo, vaidade, dependência). CTA de comentário com pergunta de autodiagnóstico. Voz em 'você', com 'tu' escapando na citação do P5."
