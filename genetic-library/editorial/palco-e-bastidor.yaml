name: palco-e-bastidor
published: post10:03
family: editorial_clean
thesis: "A vida adulta tem palco e bastidor: maturidade é ter filtro sem perder o coração — quem confunde os dois vira personagem ou se expõe à plateia errada."
architecture: paradox
hook_family: question
cta: share_specific
slides:
  - n: 1
    role: interruption
    headline: "Por que a vida adulta é um teatro — e quem esquece disso se arrebenta?"
    body: null
  - n: 2
    role: conflict
    headline: "Porque você entra achando que é “ser você mesmo” o tempo todo"
    body: "Aí você quebra a cara. No mundo adulto, ninguém vive em verdade crua 24 horas por dia. Existe horário, contexto, hierarquia, clima, gente sensível, gente perigosa, gente falsa, gente educada. Se você ignora isso, você vira ou um ingênuo atropelado… ou um sujeito inconveniente que se acha profundo."
  - n: 3
    role: revelation
    headline: "A máscara social não é mentira: é filtro"
    body: "Etiqueta não é falsidade, é civilidade. É um jeito de conviver sem transformar todo encontro em guerra. Você escolhe palavras, segura impulsos, mede tom, respeita o espaço do outro. Isso não é “se vender”. Isso é saber viver em sociedade sem ser um bicho solto."
  - n: 4
    role: mechanism
    headline: "O palco existe porque a gente não é Deus"
    body: "Você não controla como os outros te interpretam. Você não controla o humor da sala. Você não controla o que o outro vai usar contra você amanhã. Então sim, a vida adulta tem palco, tem personagem, tem roteiro mínimo. E quem não aprende esse roteiro vira alvo fácil."
  - n: 5
    role: escalation
    headline: "Só que tem um risco: você grudar na máscara"
    body: "Tem gente que aprende tão bem a performance que esquece quem é sem ela. Vira vereador emocional: fala com todo mundo, agrada geral, parece socialmente impecável… e não tem intimidade com ninguém. É um sujeito cheio de contato e vazio de vínculo."
  - n: 6
    role: contrast
    headline: "O outro risco é o oposto: virar mendigo de intimidade"
    body: "É o “sincero demais” que se despe por qualquer migalha de atenção. Conheceu alguém hoje e já abre trauma, já conta tudo, já entrega o coração como se isso fosse profundidade. Não é. É carência. Bastidor não é praça pública."
  - n: 7
    role: reorganization
    headline: "Bastidor é sagrado, e por isso é pra poucos"
    body: "Todo teatro tem bastidores. É onde você descansa, tira figurino, recupera fôlego, lembra do que importa. Na vida, bastidor é intimidade: família, amigo de verdade, confessor, terapeuta, gente que te conhece sem maquiagem. Isso custa caro e vale caro."
  - n: 8
    role: second_turn
    headline: "O erro que destrói muita gente é confundir palco com bastidor"
    body: "Tem gente que vive no palco e chama isso de “vida social”. Tem gente que tenta transformar qualquer palco em bastidor e chama isso de “autenticidade”. Os dois se arrebentam: um porque vira personagem, o outro porque se expõe pra plateia errada."
  - n: 9
    role: hammer
    headline: "O adulto saudável faz uma coisa simples e rara"
    body: "Ele sabe qual papel está representando e não se confunde com ele. Ele tem etiqueta sem virar falso. Ele tem intimidade sem virar carente. Ele mantém a máscara no mundo e mantém a alma em casa. Isso é maturidade: ter filtro sem perder o coração."
  - n: 10
    role: reorganization
    headline: "Um teste rápido pra hoje"
    body: "Pensa nas últimas semanas: você tá errando mais por viver no palco o tempo inteiro… ou por levar gente demais pros bastidores? Se isso te deu clareza, segue o perfil."
notes: "TOP DESEMPENHO (indicado por Diego em 27/09). Metáfora única organiza tudo: palco × bastidor, e o filme (O Show de Truman) é a própria tese — o homem que vive num palco sem saber; as 10 imagens são do mesmo filme, o que dá unidade e puxa o fandom. Paradoxo com dois riscos simétricos (grudar na máscara × mendigo de intimidade) e síntese no P9 ('filtro sem perder o coração'). P10 é um teste prático de autodiagnóstico + CTA de seguir. Frases-assinatura: 'vereador emocional', 'cheio de contato e vazio de vínculo', 'bastidor não é praça pública'. Voz em 'você' (anterior à regra 'sempre tu')."
